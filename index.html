<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cổng Tài Liệu & Đặc Tả Hệ Thống - Spec UI System</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <!-- Base Theme Themeable -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />

    <!-- custom docsify-tabs css variables -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.css" />

    <!-- Style riêng của team (Spec UI System) -->
    <link rel="stylesheet" href="custom.css" />

    <!-- Tabler Icons Webfont CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

    <!-- Diagrams.net/Draw.io HTML embed static viewer script -->
    <script type="text/javascript" src="https://viewer.diagrams.net/js/viewer-static.min.js"></script>
  </head>
  <body>
    <div id="app">Đang tải tài liệu đặc tả hệ thống...</div>

    <script>
      window.$docsify = {
        // Thông tin dự án
        name: "System Spec Docs",
        repo: "",

        // Cấu trúc và điều hướng
        loadSidebar: true,
        loadNavbar: true,
        coverpage: false,
        onlyCover: false,
        subMaxLevel: 3,
        auto2top: true,

        // Cấu hình Tìm kiếm (Search)
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "Tìm kiếm module, API, logic ngầm...",
          noData: "Không tìm thấy kết quả phù hợp!",
          depth: 6,
        },

        // Cấu hình Tabs
        tabs: {
          persist: true,
          sync: true,
          theme: "classic",
          tabComments: true,
          tabHeadings: true,
        },

        // Cấu hình Pagination
        pagination: {
          previousText: "TRANG TRƯỚC",
          nextText: "TRANG SAU",
          crossChapter: true,
          crossChapterText: true,
        },

        // Cấu hình Copy Code
        copyCode: {
          buttonText: "Sao chép",
          errorText: "Lỗi",
          successText: "Đã sao chép!",
        },

        // Tùy chỉnh bộ dịch Markdown để bọc sơ đồ Mermaid hoặc Draw.io
        markdown: {
          renderer: {
            code: function (code, lang) {
              if (lang === "mermaid") {
                return '<div class="diagram-wrapper"><pre class="mermaid">' + code + "</pre></div>";
              }
              if (lang === "drawio") {
                var config = {
                  xml: code,
                  nav: true,
                  resize: true,
                  toolbar: "zoom layers tags",
                };
                var jsonStr = JSON.stringify(config);
                var escapedJson = jsonStr.replace(/[&<>'"]/g, function (tag) {
                  var chars = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "'": "&#39;",
                    '"': "&quot;",
                  };
                  return chars[tag] || tag;
                });
                return (
                  '<div class="diagram-wrapper" style="margin: 20px 0;">' +
                  '  <div class="mxgraph" style="max-width:100%; border:1px solid #e5d9c8; border-radius: 4px; min-height: 600px; background-color: #ffffff;" data-mxgraph="' +
                  escapedJson +
                  '"></div>' +
                  "</div>"
                );
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },

        // Lifecycle Hooks & Plugins
        plugins: [
          function (hook, vm) {
            hook.doneEach(function () {
              // Khởi chạy vẽ sơ đồ cho các class .mxgraph (Draw.io)
              if (window.GraphViewer && typeof window.GraphViewer.processElements === "function") {
                window.GraphViewer.processElements();
              }

              // Tải Mermaid động qua ESM để áp dụng cấu hình và style chuẩn
              import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs")
                .then((module) => {
                  const mermaid = module.default;
                  mermaid.initialize({
                    startOnLoad: false,
                    theme: "base",
                    themeVariables: {
                      fontFamily: '"Be Vietnam Pro", "Segoe UI", sans-serif',
                      fontSize: "13px",
                      primaryColor: "#fffaf2",
                      primaryBorderColor: "#e5d9c8",
                      primaryTextColor: "#1b2430",
                      lineColor: "#0f6b63",
                      arrowheadColor: "#0f6b63",
                      background: "#ffffff",
                      clusterBkg: "#fbf8f3",
                      clusterBorder: "#e5d9c8",
                      actorBkg: "#fffaf2",
                      actorBorder: "#e5d9c8",
                      actorTextColor: "#1b2430",
                      signalColor: "#0f6b63",
                      signalTextColor: "#4b5563",
                      labelBoxBkgColor: "#fbf8f3",
                      labelBoxBorderColor: "#e5d9c8",
                      loopBkgColor: "#faf6ee",
                    },
                    flowchart: { useMaxWidth: true, htmlLabels: true },
                    sequence: { useMaxWidth: true, showSequenceNumbers: true },
                    gantt: { useMaxWidth: true },
                  });

                  mermaid.setParseErrorHandler((err, hash) => {
                    console.error(">>> MERMAID PARSE ERROR:", err, hash);
                    window.__lastMermaidError = err;
                  });

                  // Khởi chạy vẽ sơ đồ cho các class .mermaid
                  const elements = document.querySelectorAll(".mermaid");
                  if (elements.length > 0) {
                    const cleanNodes = [];
                    elements.forEach((el) => {
                      if (el.getAttribute("data-processed") === "true") return;

                      // Clone để xử lý bóc tách sạch sẽ
                      const clone = el.cloneNode(true);

                      // Xóa triệt để nút copy-code do plugin docsify-copy-code chèn vào <pre>
                      const copyBtns = clone.querySelectorAll(".docsify-copy-code-button, button");
                      copyBtns.forEach((btn) => btn.remove());

                      // Lấy nội dung text thuần túy
                      let rawCode = clone.textContent.trim();

                      // Dự phòng loại bỏ triệt để các chuỗi nhãn copy-code nếu còn sót lại
                      rawCode = rawCode
                        .replace(/Sao chépLỗiĐã sao chép!/g, "")
                        .replace(/CopyErrorSuccess/g, "")
                        .trim();

                      if (!rawCode) return;

                      const cleanDiv = document.createElement("div");
                      cleanDiv.className = "mermaid";
                      cleanDiv.textContent = rawCode;
                      el.parentNode.replaceChild(cleanDiv, el);
                      cleanNodes.push(cleanDiv);

                      const wrapper = cleanDiv.closest(".diagram-wrapper");
                      if (wrapper) {
                        wrapper._rawMermaidCode = rawCode;
                      }

                      // Thêm thanh công cụ Smart Diagram Toolbar mở rộng
                      if (wrapper && !wrapper.querySelector(".diagram-toolbar")) {
                        const toolbar = document.createElement("div");
                        toolbar.className = "diagram-toolbar";
                        toolbar.innerHTML = `
                          <span class="diagram-toolbar-title">
                            <i class="ti ti-sitemap"></i>
                            Sơ Đồ Hệ Thống
                            <span class="diagram-toolbar-hint" title="Bấm vào một nút trên sơ đồ để làm sáng luồng kết nối và làm mờ các thành phần khác">
                              <i class="ti ti-pointer"></i> Click node để focus
                            </span>
                          </span>
                          <div class="diagram-toolbar-actions">
                            <button type="button" class="diagram-btn-action diagram-btn-copy" title="Sao chép mã nguồn Mermaid">
                              <i class="ti ti-code"></i>
                              <span>Sao chép mã</span>
                            </button>
                            <button type="button" class="diagram-btn-action diagram-btn-export-svg" title="Xuất file vector SVG sắc nét">
                              <i class="ti ti-file-type-svg"></i>
                              <span>SVG</span>
                            </button>
                            <button type="button" class="diagram-btn-action diagram-btn-export-png" title="Tải ảnh PNG độ nét cao (2x High-Res)">
                              <i class="ti ti-file-type-png"></i>
                              <span>PNG</span>
                            </button>
                            <button type="button" class="diagram-btn-action diagram-btn-zoom" title="Chuyển đổi giữa chế độ vừa khung và xem kích thước gốc (1:1)">
                              <i class="ti ti-arrows-maximize"></i>
                              <span>Xem 1:1</span>
                            </button>
                            <button type="button" class="diagram-btn-action diagram-btn-fullscreen" title="Mở modal xem toàn màn hình tương tác (Fullscreen)">
                              <i class="ti ti-maximize"></i>
                              <span>Toàn màn hình</span>
                            </button>
                          </div>
                        `;

                        // Xử lý nút Sao chép mã Mermaid
                        const btnCopy = toolbar.querySelector(".diagram-btn-copy");
                        btnCopy.addEventListener("click", function (e) {
                          e.preventDefault();
                          copyMermaidCode(wrapper._rawMermaidCode, btnCopy);
                        });

                        // Xử lý nút Xuất SVG
                        const btnExportSVG = toolbar.querySelector(".diagram-btn-export-svg");
                        btnExportSVG.addEventListener("click", function (e) {
                          e.preventDefault();
                          const svg = wrapper.querySelector(".mermaid svg");
                          const captionEl = wrapper.querySelector(".diagram-caption");
                          const title = captionEl ? captionEl.textContent.trim() : "diagram";
                          exportDiagramSVG(svg, title);
                        });

                        // Xử lý nút Tải PNG
                        const btnExportPNG = toolbar.querySelector(".diagram-btn-export-png");
                        btnExportPNG.addEventListener("click", function (e) {
                          e.preventDefault();
                          const svg = wrapper.querySelector(".mermaid svg");
                          const captionEl = wrapper.querySelector(".diagram-caption");
                          const title = captionEl ? captionEl.textContent.trim() : "diagram";
                          exportDiagramPNG(svg, title, 2);
                        });

                        // Xử lý nút Zoom kích thước gốc (1:1)
                        const btnZoom = toolbar.querySelector(".diagram-btn-zoom");
                        btnZoom.addEventListener("click", function (e) {
                          e.preventDefault();
                          const svg = wrapper.querySelector(".mermaid svg");
                          const isZoomed = wrapper.classList.toggle("is-zoomed");
                          if (isZoomed) {
                            if (svg) {
                              const vb = svg.getAttribute("viewBox");
                              const parts = vb ? vb.trim().split(/\s+/) : [];
                              const nativeWidth = parts.length === 4 ? parseFloat(parts[2]) : 1600;
                              svg.style.setProperty("width", nativeWidth + "px", "important");
                              svg.style.setProperty("max-width", "none", "important");
                            }
                            btnZoom.innerHTML = '<i class="ti ti-arrows-minimize"></i><span>Thu vừa khung</span>';
                            btnZoom.style.background = "var(--accent-2)";
                            btnZoom.style.color = "#ffffff";
                          } else {
                            if (svg) {
                              svg.style.removeProperty("width");
                              svg.style.removeProperty("max-width");
                            }
                            btnZoom.innerHTML = '<i class="ti ti-arrows-maximize"></i><span>Xem 1:1</span>';
                            btnZoom.style.background = "";
                            btnZoom.style.color = "";
                            wrapper.scrollLeft = 0;
                          }
                        });

                        // Xử lý nút Fullscreen Modal
                        const btnFullscreen = toolbar.querySelector(".diagram-btn-fullscreen");
                        btnFullscreen.addEventListener("click", function (e) {
                          e.preventDefault();
                          openDiagramModal(wrapper);
                        });

                        // Hỗ trợ nhấp đúp vào sơ đồ để phóng to / thu nhỏ nhanh
                        wrapper.addEventListener("dblclick", function (e) {
                          if (e.target.closest(".diagram-btn-action")) return;
                          btnZoom.click();
                        });

                        wrapper.insertBefore(toolbar, wrapper.firstChild);
                      }
                    });

                    if (cleanNodes.length > 0) {
                      mermaid
                        .run({
                          nodes: cleanNodes,
                        })
                        .then(() => {
                          // Kích hoạt tính năng Interactive Node Focus & Path Highlight sau khi SVG được render
                          cleanNodes.forEach((node) => {
                            const svg = node.querySelector("svg");
                            if (svg) {
                              setupDiagramFocusInteractivity(svg);
                            }
                          });
                        })
                        .catch((err) => {
                          console.warn("Lỗi vẽ sơ đồ Mermaid: ", err);
                        });
                    }
                  }

                  // ==============================================================
                  // CÁC HÀM TIỆN ÍCH XUẤT ẢNH VECTOR & RASTER & SAO CHÉP MÃ NGUỒN
                  // ==============================================================
                  function getSanitizedFilename(title) {
                    let name = (title || "diagram")
                      .toLowerCase()
                      .normalize("NFD")
                      .replace(/[\u0300-\u036f]/g, "")
                      .replace(/[^a-z0-9]+/g, "-")
                      .replace(/^-+|-+$/g, "");
                    return name || "diagram";
                  }

                  function copyMermaidCode(rawCode, btnElement) {
                    if (!rawCode) return;
                    navigator.clipboard
                      .writeText(rawCode)
                      .then(() => {
                        btnElement.classList.add("is-copied");
                        const oldHTML = btnElement.innerHTML;
                        btnElement.innerHTML = '<i class="ti ti-check"></i><span>Đã sao chép!</span>';
                        setTimeout(() => {
                          btnElement.classList.remove("is-copied");
                          btnElement.innerHTML = oldHTML;
                        }, 2000);
                      })
                      .catch((err) => {
                        console.error("Lỗi khi sao chép mã Mermaid: ", err);
                      });
                  }

                  function exportDiagramSVG(svgElement, title) {
                    if (!svgElement) return;
                    const clone = svgElement.cloneNode(true);
                    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                    clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

                    const vb = clone.getAttribute("viewBox");
                    let width = 1600,
                      height = 900;
                    if (vb) {
                      const parts = vb.trim().split(/\s+/);
                      if (parts.length === 4) {
                        width = parseFloat(parts[2]);
                        height = parseFloat(parts[3]);
                      }
                    } else {
                      width = clone.clientWidth || 1600;
                      height = clone.clientHeight || 900;
                    }

                    clone.setAttribute("width", width);
                    clone.setAttribute("height", height);
                    clone.style.width = width + "px";
                    clone.style.height = height + "px";
                    clone.style.maxWidth = "none";

                    // Chèn rect nền sáng để hiển thị đẹp trên mọi ứng dụng
                    const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    bgRect.setAttribute("width", "100%");
                    bgRect.setAttribute("height", "100%");
                    bgRect.setAttribute("fill", "#fffdf9");
                    clone.insertBefore(bgRect, clone.firstChild);

                    const serializer = new XMLSerializer();
                    let svgString = serializer.serializeToString(clone);
                    if (!svgString.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
                      svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
                    }

                    const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = getSanitizedFilename(title) + ".svg";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                  }

                  function exportDiagramPNG(svgElement, title, scaleFactor) {
                    if (!svgElement) return;
                    scaleFactor = scaleFactor || 2;
                    const clone = svgElement.cloneNode(true);
                    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                    clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

                    const vb = clone.getAttribute("viewBox");
                    let width = 1600,
                      height = 900;
                    if (vb) {
                      const parts = vb.trim().split(/\s+/);
                      if (parts.length === 4) {
                        width = parseFloat(parts[2]);
                        height = parseFloat(parts[3]);
                      }
                    } else {
                      width = clone.clientWidth || 1600;
                      height = clone.clientHeight || 900;
                    }

                    const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    bgRect.setAttribute("width", "100%");
                    bgRect.setAttribute("height", "100%");
                    bgRect.setAttribute("fill", "#fffdf9");
                    clone.insertBefore(bgRect, clone.firstChild);

                    const serializer = new XMLSerializer();
                    let svgString = serializer.serializeToString(clone);
                    if (!svgString.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
                      svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
                    }

                    const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = function () {
                      const canvas = document.createElement("canvas");
                      canvas.width = Math.round(width * scaleFactor);
                      canvas.height = Math.round(height * scaleFactor);
                      const ctx = canvas.getContext("2d");

                      ctx.fillStyle = "#fffdf9";
                      ctx.fillRect(0, 0, canvas.width, canvas.height);
                      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                      URL.revokeObjectURL(url);

                      canvas.toBlob(function (pngBlob) {
                        if (!pngBlob) return;
                        const pngUrl = URL.createObjectURL(pngBlob);
                        const a = document.createElement("a");
                        a.href = pngUrl;
                        a.download = getSanitizedFilename(title) + ".png";
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
                      }, "image/png");
                    };
                    img.onerror = function (err) {
                      console.error("Lỗi khi tải ảnh SVG vào Canvas PNG: ", err);
                      URL.revokeObjectURL(url);
                    };
                    img.src = url;
                  }

                  // ==============================================================
                  // THUẬT TOÁN INTERACTIVE NODE FOCUS & PATH HIGHLIGHTING
                  // ==============================================================
                  function setupDiagramFocusInteractivity(svg) {
                    if (!svg || svg.__focusInitialized) return;
                    svg.__focusInitialized = true;
                    svg.classList.add("diagram-interactive-canvas");

                    const nodes = Array.from(svg.querySelectorAll(".node, .actor"));
                    if (nodes.length === 0) return;

                    const edges = Array.from(svg.querySelectorAll(".edgePath, .messageLine0, .messageLine1"));
                    const edgeLabels = Array.from(svg.querySelectorAll(".edgeLabel, .messageText"));

                    function getNodeKey(nodeEl) {
                      if (nodeEl.getAttribute("data-id")) return nodeEl.getAttribute("data-id");
                      const id = nodeEl.id || "";
                      const match = id.match(/^flowchart-([^-]+(?:-[^-]+)*)-\d+$/);
                      if (match) return match[1];
                      if (nodeEl.classList.contains("actor")) {
                        return (nodeEl.textContent || id).trim();
                      }
                      return id;
                    }

                    // Bản đồ quan hệ các cạnh (Edge Mapping)
                    const edgeMap = [];
                    edges.forEach((edgeEl, idx) => {
                      const classList = Array.from(edgeEl.classList);
                      let src = null,
                        tgt = null;

                      classList.forEach((cls) => {
                        if (cls.startsWith("LS-")) src = cls.substring(3);
                        if (cls.startsWith("LE-")) tgt = cls.substring(3);
                      });

                      if (!src || !tgt) {
                        const id = edgeEl.id || "";
                        const idMatch = id.match(/^L[_-]([^-]+)[_-]([^-]+)$/);
                        if (idMatch) {
                          src = idMatch[1];
                          tgt = idMatch[2];
                        }
                      }

                      // Dự phòng liên kết hình học: kiểm tra tọa độ start/end path với bounding box
                      const path = edgeEl.querySelector("path");
                      if ((!src || !tgt) && path && typeof path.getPointAtLength === "function") {
                        try {
                          const totalLen = path.getTotalLength();
                          if (totalLen > 0) {
                            const ptStart = path.getPointAtLength(0);
                            const ptEnd = path.getPointAtLength(totalLen);
                            nodes.forEach((n) => {
                              try {
                                const bb = n.getBBox();
                                const pad = 35;
                                if (
                                  !src &&
                                  ptStart.x >= bb.x - pad &&
                                  ptStart.x <= bb.x + bb.width + pad &&
                                  ptStart.y >= bb.y - pad &&
                                  ptStart.y <= bb.y + bb.height + pad
                                ) {
                                  src = getNodeKey(n);
                                }
                                if (
                                  !tgt &&
                                  ptEnd.x >= bb.x - pad &&
                                  ptEnd.x <= bb.x + bb.width + pad &&
                                  ptEnd.y >= bb.y - pad &&
                                  ptEnd.y <= bb.y + bb.height + pad
                                ) {
                                  tgt = getNodeKey(n);
                                }
                              } catch (e) {}
                            });
                          }
                        } catch (e) {}
                      }

                      edgeMap.push({
                        edgeEl: edgeEl,
                        labelEl: edgeLabels[idx] || null,
                        src: src,
                        tgt: tgt,
                      });
                    });

                    function clearFocus() {
                      svg.classList.remove("diagram-has-focus");
                      nodes.forEach((n) => n.classList.remove("node-focused", "neighbor-focused", "actor-focused"));
                      edges.forEach((e) => e.classList.remove("edge-focused", "message-focused"));
                      edgeLabels.forEach((l) => l.classList.remove("edge-focused", "message-focused"));
                    }

                    function focusNode(targetNode) {
                      const isAlreadyFocused = targetNode.classList.contains("node-focused");
                      clearFocus();
                      if (isAlreadyFocused) return;

                      svg.classList.add("diagram-has-focus");
                      targetNode.classList.add("node-focused");

                      const targetKey = getNodeKey(targetNode);
                      if (!targetKey) return;

                      const neighborKeys = new Set();
                      const lowerTarget = targetKey.toLowerCase();

                      edgeMap.forEach((entry) => {
                        const lowerSrc = entry.src ? entry.src.toLowerCase() : "";
                        const lowerTgt = entry.tgt ? entry.tgt.toLowerCase() : "";
                        if (lowerSrc === lowerTarget || lowerTgt === lowerTarget) {
                          entry.edgeEl.classList.add("edge-focused");
                          if (entry.labelEl) entry.labelEl.classList.add("edge-focused");
                          if (lowerSrc && lowerSrc !== lowerTarget) neighborKeys.add(lowerSrc);
                          if (lowerTgt && lowerTgt !== lowerTarget) neighborKeys.add(lowerTgt);
                        }
                      });

                      nodes.forEach((n) => {
                        const k = getNodeKey(n);
                        if (k && neighborKeys.has(k.toLowerCase())) {
                          n.classList.add("neighbor-focused");
                        }
                      });

                      if (targetNode.classList.contains("actor")) {
                        targetNode.classList.add("actor-focused");
                        edges.forEach((e) => e.classList.add("message-focused"));
                        edgeLabels.forEach((l) => l.classList.add("message-focused"));
                      }
                    }

                    nodes.forEach((nodeEl) => {
                      nodeEl.addEventListener("click", function (e) {
                        e.stopPropagation();
                        focusNode(nodeEl);
                      });
                    });

                    svg.addEventListener("click", function (e) {
                      if (!e.target.closest(".node, .actor")) {
                        clearFocus();
                      }
                    });
                  }

                  // ==============================================================
                  // QUẢN LÝ MODAL FULLSCREEN CHO TẤT CẢ SƠ ĐỒ (Figma/Miro Level)
                  // ==============================================================
                  function openDiagramModal(wrapper) {
                    const svg = wrapper.querySelector(".mermaid svg");
                    if (!svg) return;

                    const captionEl = wrapper.querySelector(".diagram-caption");
                    const caption = captionEl ? captionEl.textContent.trim() : "Sơ Đồ Hệ Thống";

                    let modal = document.getElementById("diagram-modal");
                    if (!modal) {
                      modal = document.createElement("div");
                      modal.id = "diagram-modal";
                      modal.className = "diagram-modal";
                      modal.innerHTML = `
                      <div class="diagram-modal-backdrop"></div>
                      <div class="diagram-modal-container">
                        <div class="diagram-modal-header">
                          <div class="diagram-modal-title">
                            <i class="ti ti-sitemap"></i>
                            <span class="diagram-modal-caption-text"></span>
                          </div>
                          <div class="diagram-modal-controls">
                            <button type="button" class="diagram-modal-btn modal-zoom-out" title="Thu nhỏ (Phím -)">
                              <i class="ti ti-minus"></i>
                            </button>
                            <span class="diagram-modal-zoom-level">100%</span>
                            <button type="button" class="diagram-modal-btn modal-zoom-in" title="Phóng to (Phím +)">
                              <i class="ti ti-plus"></i>
                            </button>
                            <div class="diagram-modal-presets">
                              <button type="button" class="diagram-preset-btn modal-preset-fit is-active" data-scale="fit" title="Khôi phục vừa khít khung (Phím 0)">Fit</button>
                              <button type="button" class="diagram-preset-btn" data-scale="0.5" title="Thu nhỏ 50% (Phím 5)">50%</button>
                              <button type="button" class="diagram-preset-btn" data-scale="1" title="Kích thước gốc 100% (Phím 1)">100%</button>
                              <button type="button" class="diagram-preset-btn" data-scale="1.5" title="Phóng to 150%">150%</button>
                              <button type="button" class="diagram-preset-btn" data-scale="2" title="Phóng to 200% (Phím 2)">200%</button>
                            </div>
                            <div class="diagram-modal-divider"></div>
                            <button type="button" class="diagram-modal-btn modal-native-fullscreen" title="Toàn màn hình trình duyệt (Phím F)">
                              <i class="ti ti-maximize"></i>
                              <span>F11</span>
                            </button>
                            <div class="diagram-modal-divider"></div>
                            <button type="button" class="diagram-modal-btn modal-export-svg" title="Xuất file vector SVG sắc nét">
                              <i class="ti ti-file-type-svg"></i>
                              <span>SVG</span>
                            </button>
                            <button type="button" class="diagram-modal-btn modal-export-png" title="Tải ảnh PNG độ nét cao (2x High-Res)">
                              <i class="ti ti-file-type-png"></i>
                              <span>PNG</span>
                            </button>
                            <div class="diagram-modal-divider"></div>
                            <button type="button" class="diagram-modal-btn modal-close" title="Đóng (Phím Esc)">
                              <i class="ti ti-x"></i>
                              <span>Đóng (Esc)</span>
                            </button>
                          </div>
                        </div>
                        <div class="diagram-modal-body">
                          <div class="diagram-modal-viewport">
                            <div class="diagram-modal-content"></div>
                          </div>
                        </div>
                        <div class="diagram-modal-footer">
                          <span><i class="ti ti-info-circle"></i> <b>Cuộn chuột</b> để zoom • <b>Kéo chuột</b> để lia • <b>Click node</b> để làm nổi bật luồng kết nối • Phím tắt: <b>1 / 2 / 5 / 0 / F / Esc</b></span>
                        </div>
                      </div>
                    `;
                      document.body.appendChild(modal);

                      // Khởi tạo các sự kiện điều khiển Modal
                      const backdrop = modal.querySelector(".diagram-modal-backdrop");
                      const closeBtn = modal.querySelector(".modal-close");
                      const zoomInBtn = modal.querySelector(".modal-zoom-in");
                      const zoomOutBtn = modal.querySelector(".modal-zoom-out");
                      const zoomLabel = modal.querySelector(".diagram-modal-zoom-level");
                      const viewport = modal.querySelector(".diagram-modal-viewport");
                      const content = modal.querySelector(".diagram-modal-content");
                      const presetBtns = modal.querySelectorAll(".diagram-preset-btn");
                      const nativeFsBtn = modal.querySelector(".modal-native-fullscreen");
                      const modalExportSVGBtn = modal.querySelector(".modal-export-svg");
                      const modalExportPNGBtn = modal.querySelector(".modal-export-png");

                      let currentScale = 1;
                      let panX = 0;
                      let panY = 0;
                      let isDragging = false;
                      let startX = 0;
                      let startY = 0;

                      function applyTransform() {
                        content.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
                        zoomLabel.textContent = Math.round(currentScale * 100) + "%";
                      }

                      function updateActivePreset(scaleVal) {
                        presetBtns.forEach((btn) => {
                          const s = btn.getAttribute("data-scale");
                          if (s === String(scaleVal) || (scaleVal === "fit" && s === "fit")) {
                            btn.classList.add("is-active");
                          } else {
                            btn.classList.remove("is-active");
                          }
                        });
                      }

                      function resetView() {
                        const svgInside = content.querySelector("svg");
                        if (svgInside) {
                          const vb = svgInside.getAttribute("viewBox");
                          const parts = vb ? vb.trim().split(/\s+/) : [];
                          const nativeWidth = parts.length === 4 ? parseFloat(parts[2]) : 1600;
                          const nativeHeight = parts.length === 4 ? parseFloat(parts[3]) : 900;
                          const availW = viewport.clientWidth - 100;
                          const availH = viewport.clientHeight - 100;
                          const scale = Math.min(availW / nativeWidth, availH / nativeHeight, 1.0);
                          currentScale = Math.max(0.15, scale);
                        } else {
                          currentScale = 1;
                        }
                        panX = 0;
                        panY = 0;
                        applyTransform();
                        updateActivePreset("fit");
                      }

                      function setPresetScale(targetScale) {
                        currentScale = Math.min(Math.max(0.15, targetScale), 5);
                        panX = 0;
                        panY = 0;
                        applyTransform();
                        updateActivePreset(targetScale);
                      }

                      function zoom(delta, clientX, clientY) {
                        const prevScale = currentScale;
                        let newScale = currentScale + delta;
                        newScale = Math.min(Math.max(0.15, newScale), 5);
                        if (newScale === prevScale) return;

                        if (clientX !== undefined && clientY !== undefined) {
                          const rect = viewport.getBoundingClientRect();
                          const mouseX = clientX - rect.left - rect.width / 2;
                          const mouseY = clientY - rect.top - rect.height / 2;
                          panX -= (mouseX - panX) * (newScale / prevScale - 1);
                          panY -= (mouseY - panY) * (newScale / prevScale - 1);
                        }

                        currentScale = newScale;
                        applyTransform();
                        presetBtns.forEach((btn) => btn.classList.remove("is-active"));
                      }

                      zoomInBtn.addEventListener("click", () => zoom(0.2));
                      zoomOutBtn.addEventListener("click", () => zoom(-0.2));

                      presetBtns.forEach((btn) => {
                        btn.addEventListener("click", function (e) {
                          e.preventDefault();
                          const scale = btn.getAttribute("data-scale");
                          if (scale === "fit") {
                            resetView();
                          } else {
                            setPresetScale(parseFloat(scale));
                          }
                        });
                      });

                      // Native Fullscreen Toggle (F11 API)
                      function toggleNativeFullscreen() {
                        if (!document.fullscreenElement) {
                          modal.requestFullscreen().catch((err) => console.warn(err));
                        } else {
                          document.exitFullscreen().catch((err) => console.warn(err));
                        }
                      }

                      nativeFsBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        toggleNativeFullscreen();
                      });

                      document.addEventListener("fullscreenchange", function () {
                        if (document.fullscreenElement) {
                          nativeFsBtn.innerHTML = '<i class="ti ti-minimize"></i><span>F11</span>';
                          nativeFsBtn.title = "Thoát toàn màn hình (Phím F hoặc Esc)";
                        } else {
                          nativeFsBtn.innerHTML = '<i class="ti ti-maximize"></i><span>F11</span>';
                          nativeFsBtn.title = "Toàn màn hình trình duyệt (Phím F)";
                        }
                      });

                      // Xuất ảnh từ trong Modal
                      modalExportSVGBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const currentSvg = content.querySelector("svg");
                        const title = modal.querySelector(".diagram-modal-caption-text").textContent;
                        exportDiagramSVG(currentSvg, title);
                      });

                      modalExportPNGBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const currentSvg = content.querySelector("svg");
                        const title = modal.querySelector(".diagram-modal-caption-text").textContent;
                        exportDiagramPNG(currentSvg, title, 2);
                      });

                      // Cuộn chuột zoom theo con trỏ chuột
                      viewport.addEventListener(
                        "wheel",
                        (e) => {
                          e.preventDefault();
                          const delta = e.deltaY < 0 ? 0.12 : -0.12;
                          zoom(delta, e.clientX, e.clientY);
                        },
                        { passive: false },
                      );

                      // Kéo thả sơ đồ (Pan)
                      viewport.addEventListener("mousedown", (e) => {
                        if (e.button !== 0) return;
                        isDragging = true;
                        startX = e.clientX - panX;
                        startY = e.clientY - panY;
                        viewport.style.cursor = "grabbing";
                      });

                      window.addEventListener("mousemove", (e) => {
                        if (!isDragging) return;
                        panX = e.clientX - startX;
                        panY = e.clientY - startY;
                        applyTransform();
                      });

                      window.addEventListener("mouseup", () => {
                        if (isDragging) {
                          isDragging = false;
                          viewport.style.cursor = "grab";
                        }
                      });

                      function closeModal() {
                        if (document.fullscreenElement) {
                          document.exitFullscreen().catch(() => {});
                        }
                        modal.classList.remove("is-open");
                        document.body.style.overflow = "";
                        window.removeEventListener("keydown", handleKeydown);
                      }

                      function handleKeydown(e) {
                        if (e.key === "Escape") {
                          closeModal();
                        } else if (e.key === "+" || e.key === "=") {
                          zoom(0.2);
                        } else if (e.key === "-") {
                          zoom(-0.2);
                        } else if (e.key === "0") {
                          resetView();
                        } else if (e.key === "1") {
                          setPresetScale(1.0);
                        } else if (e.key === "2") {
                          setPresetScale(2.0);
                        } else if (e.key === "5") {
                          setPresetScale(0.5);
                        } else if (e.key === "f" || e.key === "F") {
                          toggleNativeFullscreen();
                        }
                      }

                      backdrop.addEventListener("click", closeModal);
                      closeBtn.addEventListener("click", closeModal);
                      modal._close = closeModal;
                      modal._open = function (newSvg, titleText) {
                        modal.querySelector(".diagram-modal-caption-text").textContent = titleText;
                        const cloneSvg = newSvg.cloneNode(true);

                        // Lấy kích thước vector gốc từ viewBox
                        const vb = newSvg.getAttribute("viewBox");
                        const parts = vb ? vb.trim().split(/\s+/) : [];
                        const nativeWidth = parts.length === 4 ? parseFloat(parts[2]) : newSvg.clientWidth || 1600;
                        const nativeHeight = parts.length === 4 ? parseFloat(parts[3]) : newSvg.clientHeight || 900;

                        cloneSvg.setAttribute("width", nativeWidth);
                        cloneSvg.setAttribute("height", nativeHeight);
                        cloneSvg.style.setProperty("width", nativeWidth + "px", "important");
                        cloneSvg.style.setProperty("height", nativeHeight + "px", "important");
                        cloneSvg.style.setProperty("max-width", "none", "important");
                        cloneSvg.style.display = "block";

                        content.innerHTML = "";
                        content.appendChild(cloneSvg);
                        setupDiagramFocusInteractivity(cloneSvg); // Kích hoạt Interactive Focus trong Modal

                        modal.classList.add("is-open");
                        document.body.style.overflow = "hidden";
                        window.addEventListener("keydown", handleKeydown);

                        requestAnimationFrame(() => {
                          resetView();
                        });
                      };
                    }

                    modal._open(svg, caption);
                  }
                })
                .catch((err) => console.error("Lỗi khi tải Mermaid: ", err));
            });
          },
        ],
      };
    </script>
